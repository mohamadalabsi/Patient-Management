services:
  patient-service:
    container_name: patient-service
    image: patient-service
    build:
      context: ./patient-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - application-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PATIENT_DB_NAME:?PATIENT_DB_NAME is required}
      SPRING_DATASOURCE_USERNAME: ${PATIENT_DB_USER:?PATIENT_DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${PATIENT_DB_PASSWORD:?PATIENT_DB_PASSWORD is required}
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_PORT: 9001
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  billing-service:
    container_name: billing-service
    image: billing-service
    build:
      context: ./billing-service
    networks:
      - application-network
    ports:
      - "4002:4002"
      - "9001:9001"

  analytics-service:
    container_name: analytics-service
    image: analytics-service
    build:
      context: ./analytics-service
    depends_on:
      kafka:
        condition: service_started
    networks:
      - application-network
    ports:
      - "4003:4003"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  api-gateway:
    container_name: api-gateway
    image: api-gateway
    build:
      context: ./api-gateway
    depends_on:
      - patient-service
      - auth-service
    networks:
      - application-network
    ports:
      - "4004:4004"
    environment:
      AUTH_SERVICE_URL: http://auth-service:4005
      PATIENT_SERVICE_URL: http://patient-service:4000

  auth-service:
    container_name: auth-service
    image: auth-service
    build:
      context: ./auth-service
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - application-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME:?AUTH_DB_NAME is required}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:?AUTH_DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

  postgres:
    container_name: patient-postgres
    image: postgres:16
    environment:
      POSTGRES_USER: ${PATIENT_DB_USER:?PATIENT_DB_USER is required}
      POSTGRES_PASSWORD: ${PATIENT_DB_PASSWORD:?PATIENT_DB_PASSWORD is required}
      POSTGRES_DB: ${PATIENT_DB_NAME:?PATIENT_DB_NAME is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - application-network
    ports:
      - "5000:5432"
    volumes:
      - postgres_patient_data:/var/lib/postgresql/data

  postgres-auth:
    container_name: auth-postgres
    image: postgres:16
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:?AUTH_DB_USER is required}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      POSTGRES_DB: ${AUTH_DB_NAME:?AUTH_DB_NAME is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - application-network
    ports:
      - "5001:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  kafka:
    container_name: kafka-service
    image: apache/kafka:latest
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - application-network

networks:
  application-network:
    driver: bridge

volumes:
  postgres_patient_data:
  postgres_auth_data:
