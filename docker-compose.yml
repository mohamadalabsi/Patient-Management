services:
  patient-service:
    container_name: patient-service
    image: patient-service
    # PHASE 0 (step 0.3): build from the repo root so the Dockerfile can COPY the
    # shared proto/ folder (Docker can't see files outside the build context).
    # PHASE 0 (old):
    #build:
    #  context: ./patient-service
    build:
      context: .
      dockerfile: patient-service/Dockerfile
    # PHASE 0 (step 0.4): wait until dependencies are HEALTHY, not only STARTED.
    # "service_started" only means the container exists - Kafka may still be booting,
    # so the first producer calls failed/retried. billing is added because every
    # patient creation calls it via gRPC.
    # PHASE 0 (old):
    #depends_on:
    #  postgres:
    #    condition: service_healthy
    #  kafka:
    #    condition: service_started
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      billing-service:
        condition: service_healthy
    # PHASE 0 (step 0.4): NEW healthcheck.
    # Docker runs this command inside the container every 10s. The service counts as
    # "healthy" only when Spring's readiness endpoint answers UP - i.e. the app has
    # fully started (DB connected, beans created), not just "the JVM process exists".
    # wget comes with the Alpine base image (busybox); curl is not installed there.
    # start_period: grace time for Spring Boot startup before failures count.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # PHASE 0 (step 0.4): if the process crashes, Docker starts it again (unless you
    # stopped it yourself). Kubernetes does the same automatically in Phase 7.
    restart: unless-stopped
    networks:
      - application-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PATIENT_DB_NAME:?PATIENT_DB_NAME is required}
      SPRING_DATASOURCE_USERNAME: ${PATIENT_DB_USER:?PATIENT_DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${PATIENT_DB_PASSWORD:?PATIENT_DB_PASSWORD is required}
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_PORT: 9001
      # PHASE 0 (step 0.7): max time patient-service waits for a billing gRPC call
      # (Spring Duration format: 3s, 500ms ...). Bound to billing.service.deadline.
      BILLING_SERVICE_DEADLINE: 3s
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  billing-service:
    container_name: billing-service
    image: billing-service
    # PHASE 0 (step 0.3): build from the repo root so the Dockerfile can COPY the
    # shared proto/ folder (Docker can't see files outside the build context).
    # PHASE 0 (old):
    #build:
    #  context: ./billing-service
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    # PHASE 0 (step 0.4): healthcheck on Spring's readiness endpoint (explained at patient-service).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # PHASE 0 (step 0.4): if the process crashes, Docker starts it again (unless you
    # stopped it yourself). Kubernetes does the same automatically in Phase 7.
    restart: unless-stopped
    networks:
      - application-network
    ports:
      - "4002:4002"
      - "9001:9001"

  analytics-service:
    container_name: analytics-service
    image: analytics-service
    # PHASE 0 (step 0.3): build from the repo root so the Dockerfile can COPY the
    # shared proto/ folder (Docker can't see files outside the build context).
    # PHASE 0 (old):
    #build:
    #  context: ./analytics-service
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    # PHASE 0 (old):
    #depends_on:
    #  kafka:
    #    condition: service_started
    depends_on:
      kafka:
        condition: service_healthy   # PHASE 0 (step 0.4): wait for a READY broker
    # PHASE 0 (step 0.4): healthcheck on Spring's readiness endpoint (explained at patient-service).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4003/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # PHASE 0 (step 0.4): if the process crashes, Docker starts it again (unless you
    # stopped it yourself). Kubernetes does the same automatically in Phase 7.
    restart: unless-stopped
    networks:
      - application-network
    ports:
      - "4003:4003"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  api-gateway:
    container_name: api-gateway
    image: api-gateway
    build:
      context: ./api-gateway
    # PHASE 0 (step 0.4): the short list form only waits for containers to START.
    # The long form with "service_healthy" waits until both answer readiness = UP,
    # so the gateway never routes to a service that is still booting.
    # PHASE 0 (old):
    #depends_on:
    #  - patient-service
    #  - auth-service
    # PHASE 3 (step 3.1): auth-service is retired, the gateway no longer needs it.
    # PHASE 3 (old):
    #depends_on:
    #  patient-service:
    #    condition: service_healthy
    #  auth-service:
    #    condition: service_healthy
    depends_on:
      patient-service:
        condition: service_healthy
    # PHASE 0 (step 0.4): healthcheck on Spring's readiness endpoint (explained at patient-service).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4004/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # PHASE 0 (step 0.4): if the process crashes, Docker starts it again (unless you
    # stopped it yourself). Kubernetes does the same automatically in Phase 7.
    restart: unless-stopped
    networks:
      - application-network
    ports:
      - "4004:4004"
    environment:
      # PHASE 3 (old): AUTH_SERVICE_URL: http://auth-service:4005
      PATIENT_SERVICE_URL: http://patient-service:4000
      # PHASE 3 (step 3.1): NEW - which token issuer and audience the gateway trusts
      # (read by application.yml -> spring.security.oauth2.resourceserver.jwt).
      # Values come from .env: your Auth0 tenant URL (WITH trailing "/") and the API
      # identifier. ":?" -> compose refuses to start if one is missing, instead of a
      # gateway that rejects every token.
      AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI:?AUTH0_ISSUER_URI is required (Auth0 tenant URL with trailing /)}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?AUTH0_AUDIENCE is required (Auth0 API identifier)}

  # ---------------------------------------------------------------------------
  # PHASE 3 (step 3.1): auth-service RETIRED. Auth0 handles login and issues the
  # tokens; the gateway and the services verify them with Auth0's public keys.
  # The code stays in auth-service/ (CI still builds and tests it) - it just does
  # not run in the stack any more.
