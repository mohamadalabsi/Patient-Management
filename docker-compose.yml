#      interval: 10s
#      timeout: 5s
#      retries: 10
#      start_period: 30s
#    # PHASE 0 (step 0.4): if the process crashes, Docker starts it again (unless you
#    # stopped it yourself). Kubernetes does the same automatically in Phase 7.
#    restart: unless-stopped
#    networks:
#      - application-network
#    environment:
#      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME:?AUTH_DB_NAME is required}
#      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:?AUTH_DB_USER is required}
#      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
#      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
#      # PHASE 0 (step 0.5): LOCAL DEVELOPMENT ONLY - also load db/dev-data, which seeds
#      # the test user (testuser@test.com) used by Integration-tests and api-requests.
#      # A production deployment must not set this, so no known-password admin exists.
#      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev-data

  postgres:
    container_name: patient-postgres
    image: postgres:16
    environment:
      POSTGRES_USER: ${PATIENT_DB_USER:?PATIENT_DB_USER is required}
      POSTGRES_PASSWORD: ${PATIENT_DB_PASSWORD:?PATIENT_DB_PASSWORD is required}
      POSTGRES_DB: ${PATIENT_DB_NAME:?PATIENT_DB_NAME is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - application-network
    ports:
      - "5000:5432"
    volumes:
      - postgres_patient_data:/var/lib/postgresql/data

  # PHASE 3 (step 3.1): auth-service's own database is retired with it.
  # PHASE 3 (old):
#  postgres-auth:
#    container_name: auth-postgres
#    image: postgres:16
#    environment:
#      POSTGRES_USER: ${AUTH_DB_USER:?AUTH_DB_USER is required}
#      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
#      POSTGRES_DB: ${AUTH_DB_NAME:?AUTH_DB_NAME is required}
#    healthcheck:
#      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
#      interval: 5s
#      timeout: 5s
#      retries: 10
#    networks:
#      - application-network
#    ports:
#      - "5001:5432"
#    volumes:
#      - postgres_auth_data:/var/lib/postgresql/data

  kafka:
    container_name: kafka-service
    # PHASE 0 (step 0.2): pin an exact version instead of "latest".
    # "latest" is a moving target: the same compose file can pull a different Kafka
    # tomorrow (e.g. a new major version) and break the stack without any change in
    # our repo. A pinned tag makes builds reproducible; upgrading becomes a
    # deliberate, reviewable one-line change (later automated by Dependabot, Phase 2).
    # PHASE 0 (old): image: apache/kafka:latest
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    # PHASE 0 (step 0.4): NEW healthcheck. Asks the broker for its supported API
    # versions - this only succeeds when the broker is really accepting clients.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - application-network

networks:
  application-network:
    driver: bridge

volumes:
  postgres_patient_data:
  # PHASE 3 (step 3.1): auth DB retired. This change does NOT delete the volume; remove it
  # yourself when you no longer need the old users (docker volume ls / docker volume rm).
  # PHASE 3 (old): postgres_auth_data:
