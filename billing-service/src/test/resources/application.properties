# PHASE 3 (step 3.3): NEW - test-only values for the token settings in application.yml.
# Spring loads this file IN ADDITION to application.yml (different file name). The yml has
# no defaults on purpose (billing must not start without knowing its token issuer).
# Nothing is fetched from this issuer: the decoder is lazy, and BillingGrpcServiceTest
# replaces it with a test decoder.
AUTH0_ISSUER_URI=https://issuer.test/
AUTH0_AUDIENCE=https://api.patient-management.local
