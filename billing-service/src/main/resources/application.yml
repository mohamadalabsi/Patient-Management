spring:
  application:
    name: billing-service
  # ---------------------------------------------------------------------------
  # PHASE 3 (step 3.3): NEW - which tokens billing accepts on its gRPC API.
  # Same issuer and audience as the gateway and patient-service: one Auth0 API,
  # all our services trust the same tokens. Which PERMISSION a gRPC method needs
  # is decided in grpc/BearerTokenInterceptor.java (create:billing-accounts).
  # ---------------------------------------------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences: ${AUTH0_AUDIENCE}

server:
  port: ${SERVER_PORT:4002}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9001}
    reflection-service-enabled: ${GRPC_SERVER_REFLECTION_ENABLED:true}

# -----------------------------------------------------------------------------
# PHASE 0 (step 0.4): Actuator / health checks.
#
# - Expose ONLY "health" and "info" over HTTP. Actuator has many endpoints
#   (env, beans, heapdump ...) that leak internals; never expose them publicly.
# - probes.enabled adds two special health groups:
#     /actuator/health/liveness   -> "is the process alive?"   (if not: restart it)
#     /actuator/health/readiness  -> "can it take traffic now?" (if not: don't send
#                                     requests yet, e.g. still starting up)
#   Docker Compose uses readiness in its healthcheck; Kubernetes (Phase 7) will
#   use both as livenessProbe / readinessProbe.
# - show-details: never -> the public response is only {"status":"UP"}; details
#   (DB host, disk space ...) are not leaked.
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
