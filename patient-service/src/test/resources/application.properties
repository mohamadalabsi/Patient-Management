# PHASE 3 (step 3.2): NEW - test-only values for the token settings in application.yml.
#
# Spring loads BOTH files: application.yml (main) and this application.properties (test
# classpath only); different file names, so this one adds values instead of replacing
# the yml. application.yml has no defaults for these on purpose (a service without a
# known token issuer must not start), so the tests must provide them.
#
# Nothing is downloaded from this issuer: the decoder is created lazily (first real
# token), and the tests never send a real token - they use @WithMockUser or a test
# JwtDecoder (see PatientSecurityTest).
AUTH0_ISSUER_URI=https://issuer.test/
AUTH0_AUDIENCE=https://api.patient-management.local
