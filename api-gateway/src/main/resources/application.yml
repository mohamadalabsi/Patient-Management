server:
  port: ${SERVER_PORT:4004}

# -----------------------------------------------------------------------------
# PHASE 0 (step 0.2): route configuration moved to a new property prefix.
#
#   old (Gateway 4.x):  spring.cloud.gateway.routes
#   new (Gateway 5.x):  spring.cloud.gateway.server.webflux.routes
#
# Why: Spring Cloud Gateway now ships two server flavours (webflux and webmvc),
# and each has its own property namespace. We use the reactive "webflux" one
# (see pom.xml). Gateway 5 no longer reads the old prefix - if we kept it, the
# gateway would start fine but with ZERO routes, and every request would be 404.
# The routes themselves are unchanged.
# -----------------------------------------------------------------------------

# PHASE 0 (old):
#spring:
#  application:
#    name: api-gateway
#  cloud:
#    gateway:
#      routes:
#        - id: auth-service-route
#          uri: ${AUTH_SERVICE_URL:http://auth-service:4005}
#          predicates:
#            - Path=/auth/**
#          filters:
#            - StripPrefix=1
#
#        - id: patient-service-route
#          uri: ${PATIENT_SERVICE_URL:http://patient-service:4000}
#          predicates:
#            - Path=/api/patients/**
#          filters:
#            - StripPrefix=1
#            - JwtValidation
#
#        - id: api-docs-patient-route
#          uri: ${PATIENT_SERVICE_URL:http://patient-service:4000}
#          predicates:
#            - Path=/api-docs/patients
#          filters:
#            - RewritePath=/api-docs/patients,/v3/api-docs
#
#        - id: api-docs-auth-route
#          uri: ${AUTH_SERVICE_URL:http://auth-service:4005}
#          predicates:
#            - Path=/api-docs/auth
#          filters:
#            - RewritePath=/api-docs/auth,/v3/api-docs

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:          # PHASE 0 (new): extra level "server.webflux"
        webflux:
          routes:
            # /auth/login -> auth-service /login (StripPrefix=1 removes "/auth")
            - id: auth-service-route
              uri: ${AUTH_SERVICE_URL:http://auth-service:4005}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            # /api/patients/** -> patient-service /patients/** after the token check.
            # "JwtValidation" = our class JwtValidationGatewayFilterFactory
            # (Spring strips the "GatewayFilterFactory" suffix to get the name).
            - id: patient-service-route
              uri: ${PATIENT_SERVICE_URL:http://patient-service:4000}
              predicates:
                - Path=/api/patients/**
              filters:
                - StripPrefix=1
                - JwtValidation

            - id: api-docs-patient-route
              uri: ${PATIENT_SERVICE_URL:http://patient-service:4000}
              predicates:
                - Path=/api-docs/patients
              filters:
                - RewritePath=/api-docs/patients,/v3/api-docs

            - id: api-docs-auth-route
              uri: ${AUTH_SERVICE_URL:http://auth-service:4005}
              predicates:
                - Path=/api-docs/auth
              filters:
                - RewritePath=/api-docs/auth,/v3/api-docs

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:4005}
    # PHASE 0 (step 0.8): NEW - max wait for auth-service /validate. Without it a
    # down auth-service made clients wait ~30s (TCP connect timeout) and get 500.
    timeout: ${AUTH_SERVICE_TIMEOUT:3s}

logging:
  level:
    # PHASE 0 (step 0.2): the gateway's internal package names did not change, so the
    # logger name stays the same.
    org.springframework.cloud.gateway: ${LOGGING_LEVEL_GATEWAY:info}

# -----------------------------------------------------------------------------
# PHASE 0 (step 0.4): Actuator / health checks.
#
# - Expose ONLY "health" and "info" over HTTP. Actuator has many endpoints
#   (env, beans, heapdump ...) that leak internals; never expose them publicly.
# - probes.enabled adds two special health groups:
#     /actuator/health/liveness   -> "is the process alive?"   (if not: restart it)
#     /actuator/health/readiness  -> "can it take traffic now?" (if not: don't send
#                                     requests yet, e.g. still starting up)
#   Docker Compose uses readiness in its healthcheck; Kubernetes (Phase 7) will
#   use both as livenessProbe / readinessProbe.
# - show-details: never -> the public response is only {"status":"UP"}; details
#   (DB host, disk space ...) are not leaked.
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
