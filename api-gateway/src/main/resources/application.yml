server:
  port: ${SERVER_PORT:4004}

# -----------------------------------------------------------------------------
# PHASE 0 (step 0.2): route configuration moved to a new property prefix.
#
#   old (Gateway 4.x):  spring.cloud.gateway.routes
#   new (Gateway 5.x):  spring.cloud.gateway.server.webflux.routes
#
# Why: Spring Cloud Gateway now ships two server flavours (webflux and webmvc),
# and each has its own property namespace. We use the reactive "webflux" one
# (see pom.xml). Gateway 5 no longer reads the old prefix - if we kept it, the
# gateway would start fine but with ZERO routes, and every request would be 404.
# The routes themselves are unchanged.
# -----------------------------------------------------------------------------

