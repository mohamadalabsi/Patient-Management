spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-route
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: patient-service-route
              uri: ${PATIENT_SERVICE_URL}
              predicates:
                - Path=/api/patients/**
              filters:
                - StripPrefix=1
                - JwtValidation

            - id: api-docs-patient-route
              uri: ${PATIENT_SERVICE_URL}
              predicates:
                - Path=/api-docs/patients
              filters:
                - RewritePath=/api-docs/patients,/v3/api-docs

            - id: api-docs-auth-route
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api-docs/auth
              filters:
                - RewritePath=/api-docs/auth,/v3/api-docs

auth:
  service:
    url: ${AUTH_SERVICE_URL}
    # PHASE 0 (step 0.8): NEW - max wait for auth-service /validate. Without it a
    # down auth-service made clients wait ~30s (TCP connect timeout) and get 500.
    timeout: ${AUTH_SERVICE_TIMEOUT:3s}

logging:
  level:
    org.springframework.cloud.gateway: ${LOGGING_LEVEL_GATEWAY:info}
